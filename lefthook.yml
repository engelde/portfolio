# https://lefthook.dev/configuration/
pre-commit:
  commands:
    biome:
      glob: '*.{js,jsx,ts,tsx,mjs,cjs,json,jsonc,css}'
      run: pnpm exec biome check --write --diagnostic-level=warn --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-push:
  commands:
    typecheck:
      run: pnpm typecheck
